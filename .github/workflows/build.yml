name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The image has Arm GCC but neither the MSPM0 SDK nor SysConfig; the build fetches both.
  MSPM0_SDK_TAG: mspm0_sdk_2_11_00_07
  SYSCONFIG_INSTALLER: sysconfig-1.28.1_4785-setup.run

jobs:
  # Configuration check: formatting of the XRobot YAML files and a locked module resolution.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-mspm0:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XRobot
        run: |
          git config --global --add safe.directory '*'
          pip install "xrobot==$(sed -n 's/^xrobot: *//p' Modules/modules.yaml)"

      - name: Check the configuration format
        run: xrobot format --check

      - name: Resolve the modules from xrobot.lock
        run: xrobot setup --frozen

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-mspm0:main
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build needs source/ (driverlib, device headers, startup files, the SysConfig
      # metadata) and .metadata/ of the SDK, about 250 MB of the 2.3 GB tag.
      - name: Cache the MSPM0 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .mspm0-sdk
          key: mspm0-sdk-${{ env.MSPM0_SDK_TAG }}-source

      - name: Fetch the MSPM0 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MSPM0_SDK_TAG" --filter=blob:none --sparse \
            https://github.com/TexasInstruments/mspm0-sdk .mspm0-sdk
          git -C .mspm0-sdk sparse-checkout set --no-cone /source/ /.metadata/

      - name: Cache SysConfig
        id: sysconfig-cache
        uses: actions/cache@v4
        with:
          path: .sysconfig
          key: sysconfig-${{ env.SYSCONFIG_INSTALLER }}

      - name: Install SysConfig
        if: steps.sysconfig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/sysconfig-setup.run" \
            "https://downloads.ti.com/ccs/esd/sysconfig/$SYSCONFIG_INSTALLER"
          chmod +x "$RUNNER_TEMP/sysconfig-setup.run"
          "$RUNNER_TEMP/sysconfig-setup.run" --mode unattended \
            --prefix "$GITHUB_WORKSPACE/.sysconfig"
          rm "$RUNNER_TEMP/sysconfig-setup.run"

      - name: Select the SDK and SysConfig
        run: |
          echo "MSPM0_SDK_INSTALL_DIR=$GITHUB_WORKSPACE/.mspm0-sdk" >> "$GITHUB_ENV"
          echo "SYSCONFIG_TOOL=$GITHUB_WORKSPACE/.sysconfig/sysconfig_cli.sh" >> "$GITHUB_ENV"
          git config --global --add safe.directory '*'
          git submodule status

      - name: Resolve the XRobot modules
        run: |
          pip install "xrobot==$(sed -n 's/^xrobot: *//p' Modules/modules.yaml)"
          xrobot setup --frozen

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Firmware size
        run: arm-none-eabi-size build/${{ matrix.preset }}/mspm0_minidb48.elf

  # Compatibility canary: builds against the head of the LibXR master branch.
  # A failure here is reported but does not fail the workflow.
  libxr-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/xrobot-org/docker-image-mspm0:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the MSPM0 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .mspm0-sdk
          key: mspm0-sdk-${{ env.MSPM0_SDK_TAG }}-source

      - name: Fetch the MSPM0 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MSPM0_SDK_TAG" --filter=blob:none --sparse \
            https://github.com/TexasInstruments/mspm0-sdk .mspm0-sdk
          git -C .mspm0-sdk sparse-checkout set --no-cone /source/ /.metadata/

      - name: Cache SysConfig
        id: sysconfig-cache
        uses: actions/cache@v4
        with:
          path: .sysconfig
          key: sysconfig-${{ env.SYSCONFIG_INSTALLER }}

      - name: Install SysConfig
        if: steps.sysconfig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/sysconfig-setup.run" \
            "https://downloads.ti.com/ccs/esd/sysconfig/$SYSCONFIG_INSTALLER"
          chmod +x "$RUNNER_TEMP/sysconfig-setup.run"
          "$RUNNER_TEMP/sysconfig-setup.run" --mode unattended \
            --prefix "$GITHUB_WORKSPACE/.sysconfig"
          rm "$RUNNER_TEMP/sysconfig-setup.run"

      - name: Update LibXR to master
        run: |
          echo "MSPM0_SDK_INSTALL_DIR=$GITHUB_WORKSPACE/.mspm0-sdk" >> "$GITHUB_ENV"
          echo "SYSCONFIG_TOOL=$GITHUB_WORKSPACE/.sysconfig/sysconfig_cli.sh" >> "$GITHUB_ENV"
          git config --global --add safe.directory '*'
          git -C libxr fetch --depth 1 origin master
          git -C libxr checkout --detach FETCH_HEAD
          git -C libxr log -1 --format='LibXR master: %H %s'

      - name: Resolve the XRobot modules
        run: |
          pip install "xrobot==$(sed -n 's/^xrobot: *//p' Modules/modules.yaml)"
          xrobot setup --frozen

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Firmware size
        run: arm-none-eabi-size build/release/mspm0_minidb48.elf
